[project]
name = "codey"
version = "0.0.1"
description = "A coding agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.54.0",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.0.1",
]

[project.scripts]
codey = "codey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codey"]
